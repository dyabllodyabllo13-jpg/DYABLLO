<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منظومة D</title>

<style>
:root{
--bg:#060816;
--card:#0d1326;
--gold:#d4af37;
--text:#ffffff;
--border:#1d2744;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
}

header{
padding:30px;
text-align:center;
border-bottom:1px solid var(--border);
}

.logo{
font-size:90px;
font-weight:bold;
color:var(--gold);
letter-spacing:5px;
text-shadow:0 0 25px rgba(212,175,55,.4);
}

.title{
font-size:32px;
margin-top:10px;
color:var(--gold);
}

.slogan{
margin-top:10px;
opacity:.8;
}

.topbar{
display:flex;
gap:10px;
padding:20px;
flex-wrap:wrap;
justify-content:center;
}

input{
background:#111827;
border:1px solid var(--border);
color:white;
padding:12px;
min-width:250px;
outline:none;
}

button{
background:var(--gold);
color:black;
border:none;
padding:12px 18px;
cursor:pointer;
font-weight:bold;
}

.stats{
text-align:center;
margin:20px;
font-size:18px;
}

.categories{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
padding:20px;
}

.card{
background:var(--card);
border:1px solid var(--border);
padding:25px;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
border-color:var(--gold);
}

.card h3{
margin-bottom:10px;
color:var(--gold);
}

.card p{
opacity:.7;
}

.tiktok{
margin:30px;
padding:20px;
background:var(--card);
border:1px solid var(--border);
text-align:center;
}

.footer{
padding:20px;
text-align:center;
opacity:.6;
}

@media(max-width:600px){
.logo{
font-size:60px;
}
.title{
font-size:24px;
}
}
</style>
</head>

<body>

<header>

<div class="logo">D</div>

<div class="title">منظومة D</div>

<div class="slogan">
منظومة D لا ترحب بالجميع.
</div>

</header>

<div class="topbar">

<input
type="text"
placeholder="ابحث هنا..."
>

<button>🌐 العربية</button>

<button>👤 تسجيل الدخول</button>

<button>🎯 اختبر معلوماتك</button>

</div>

<div class="stats">
⭐ نقاطك: <span id="points">0</span>
</div>

<section class="categories">

<div class="card" 
onclick="openCategory('religion')">
<h3>🕌 الدين</h3>
<p>قريباً...</p>
</div>

<div class="card"
onclick="openCategory('science')">
<h3>🔬 العلوم</h3>
<p>قريباً...</p>
</div>

<div class="card">
<h3>⚖️ القانون</h3>
<p>قريباً...</p>
</div>

<div class="card">
<h3>💻 التكنولوجيا</h3>
<p>قريباً...</p>
</div>

<div class="card">
<h3>💰 الاقتصاد</h3>
<p>قريباً...</p>
</div>

<div class="card">
<h3>🎨 الفنون</h3>
<p>قريباً...</p>
</div>

<div class="card">
<h3>🏋️ الرياضة</h3>
<p>قريباً...</p>
</div>

<div class="card">
<h3>🌍 اللغات</h3>
<p>قريباً...</p>
</div>

</section>

<div class="tiktok">

<h2>DYABLLO DYABLLO</h2>

<p>@dyabllo.dyabllo</p>

<br>

<button>TikTok</button>

</div>

<div class="footer">
D System Does Not Welcome Everyone.
</div>

<script>

let points =
localStorage.getItem("points") || 0;

document.getElementById("points")
.textContent = points;
const categories = {

science: [
"⚛️ الفيزياء",
"🧪 الكيمياء",
"🧬 الأحياء",
"➗ الرياضيات",
"🏥 الطب",
"💊 الصيدلة",
"🩺 التمريض",
"🌌 الفلك"
],

religion: [
"📖 القرآن الكريم",
"📜 الأحاديث",
"🕋 العقيدة",
"🕌 الفقه",
"📚 السيرة النبوية",
"📿 الأذكار",
"👳 قصص الأنبياء",
"🎙️ التجويد"
],

technology: [
"HTML",
"CSS",
"JavaScript",
"Python",
"AI",
"Cyber Security",
"Networks",
"Databases"
]

};

function openCategory(category){

let html = `
<div style="padding:20px">

<button onclick="location.reload()">
⬅ العودة
</button>

<h1 style="margin:20px 0">
الأقسام
</h1>

`;

categories[category].forEach(item=>{

html += `
<div
style="
background:#0d1326;
border:1px solid #1d2744;
padding:20px;
margin:10px 0;
cursor:pointer;
"
onclick="comingSoon('${item}')"
>

<h3>${item}</h3>

<p>قريباً...</p>

</div>
`;

});

html += `</div>`;

document.body.innerHTML = html;

}

function comingSoon(title){

document.body.innerHTML = `

<div
style="
padding:40px;
text-align:center;
color:white;
background:#060816;
height:100vh;
"
>

<button onclick="location.reload()">
⬅ العودة
</button>

<h1 style="margin-top:40px">
${title}
</h1>

<h2 style="color:#d4af37">
🚧 قريباً
</h2>

<p>
هذا القسم قيد التطوير.
</p>

</div>

`;

}
</script>

</body>
</html>
